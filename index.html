<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кликер</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, sans-serif;
    background: #0d0d0f;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
}
.screen {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
}
.screen.active { display: flex; }
#mainScreen { justify-content: center; }
#upgradesScreen, #purchasesScreen, #adminScreen { justify-content: flex-start; }

#demonGlow {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 0.45s ease;
    background: radial-gradient(ellipse at center, rgba(255,0,51,0.22), rgba(139,0,0,0.08) 60%, transparent 80%);
    z-index: 50;
}
body.crit-mode #demonGlow { opacity: 1; }

.score-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-bottom: 20px;
    min-height: 90px;
}

#critLabel {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 6px);
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    color: #ff0033;
    text-shadow: 0 0 20px #ff0033, 0 0 35px #ff0033;
    letter-spacing: 2px;
    line-height: 1.1;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 90;
}
#critLabel.show { animation: critLabelPop 1.2s ease-out; }
@keyframes critLabelPop {
    0%   { opacity: 0; transform: translateY(-25px) scale(0.5); }
    15%  { opacity: 1; transform: translateY(0) scale(1.25); }
    30%  { transform: translateY(0) scale(1); }
    80%  { opacity: 1; transform: translateY(4px) scale(1); }
    100% { opacity: 0; transform: translateY(15px) scale(1.1); }
}

#floatContainer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 100%;
    width: 100vw;
    height: 26vh;
    min-height: 170px;
    pointer-events: none;
    z-index: 60;
    overflow: visible;
}

.float-num {
    position: absolute;
    font-size: 28px;
    font-weight: 900;
    color: #ffcc00;
    text-shadow: 0 0 15px rgba(255,204,0,0.85);
    white-space: nowrap;
    animation: floatUp 1.2s ease-out forwards;
}
.float-num.crit {
    color: #ff0033;
    font-size: 40px;
    text-shadow: 0 0 25px #ff0033, 0 0 45px #ff0033;
}
@keyframes floatUp {
    0%   { opacity: 0; transform: translateY(25px) scale(0.6); }
    20%  { opacity: 1; transform: translateY(0) scale(1.15); }
    100% { opacity: 0; transform: translateY(-130px) scale(1); }
}

#score {
    font-size: 88px;
    font-weight: 900;
    margin: 0;
    color: #ffcc00;
    text-shadow: 0 0 35px rgba(255,204,0,0.6);
    transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.1s;
    letter-spacing: -2px;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
    width: 100%;
}
body.crit-mode #score {
    color: #ff0033 !important;
    text-shadow: 0 0 50px #ff0033, 0 0 25px #ff0033 !important;
}

.demon-btn {
    position: relative;
    overflow: hidden;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow 0.45s ease, transform 0.1s;
}
.demon-btn span { position: relative; z-index: 2; }
.demon-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #6b0000, #ff0033);
    opacity: 0;
    transition: opacity 0.45s ease;
    z-index: 1;
    pointer-events: none;
}
body.crit-mode .demon-btn::after { opacity: 1; }

#clickBtn {
    padding: 32px 40px;
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffcc00, #ff9500);
    color: #111;
    border-radius: 26px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 10px 35px rgba(255,149,0,0.45);
    letter-spacing: 1px;
    margin-top: 30px;
}
#clickBtn:active { transform: scale(0.95); }
body.crit-mode #clickBtn {
    color: #fff;
    box-shadow: 0 10px 45px rgba(255,0,51,0.75);
}

.shop-title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 20px;
    transition: color 0.45s ease, text-shadow 0.45s ease;
}
body.crit-mode .shop-title {
    color: #ff0033;
    text-shadow: 0 0 25px #ff0033;
}

.upgrade-item {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #1f1f24, #17171b);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.5);
    border: 1px solid #2c2c34;
    transition: border-color 0.45s ease, box-shadow 0.45s ease;
}
body.crit-mode .upgrade-item {
    border-color: #6b0000;
    box-shadow: 0 6px 30px rgba(255,0,51,0.35);
}

.upgrade-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.upgrade-name {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    transition: color 0.45s ease;
}
body.crit-mode .upgrade-name { color: #ff8095; }

.upgrade-level {
    font-size: 16px;
    font-weight: 800;
    color: #111;
    background-color: #ffcc00;
    padding: 5px 12px;
    border-radius: 12px;
    white-space: nowrap;
    transition: background-color 0.45s ease, color 0.45s ease;
}
body.crit-mode .upgrade-level {
    background-color: #ff0033;
    color: #fff;
}

.upgrade-desc {
    font-size: 16px;
    color: #a0a0aa;
    margin-bottom: 14px;
    line-height: 1.45;
    transition: color 0.45s ease;
}
body.crit-mode .upgrade-desc { color: #c98a95; }

.upgrade-cost {
    font-size: 18px;
    color: #ffcc00;
    font-weight: 800;
    margin-bottom: 14px;
    transition: color 0.45s ease;
}
body.crit-mode .upgrade-cost { color: #ff0033; }

.upgrade-btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 800;
    border-radius: 16px;
    background: linear-gradient(135deg, #34c759, #248a3d);
    color: #fff;
    letter-spacing: 0.5px;
}
.upgrade-btn:active { transform: scale(0.97); }
.upgrade-btn:disabled {
    background: #2a2a30 !important;
    color: #5a5a65 !important;
    transform: none;
}
.upgrade-btn:disabled::after { opacity: 0 !important; }

.purchases-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 400px;
    padding-bottom: 20px;
}
.photo-card {
    background: linear-gradient(160deg, #1f1f24, #17171b);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #2c2c34;
    display: flex;
    flex-direction: column;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
}
.photo-card.owned {
    border-color: #ffd700;
    box-shadow: 0 0 25px rgba(255,215,0,0.35);
}
.photo-img {
    height: 110px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
}
.photo-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: filter 0.4s ease, transform 0.4s ease;
}
.photo-card.locked .photo-img img {
    filter: grayscale(1) brightness(0.4) blur(6px);
}
.photo-card.locked .photo-img::after {
    content: '🔒';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    z-index: 2;
}
.photo-card.owned .photo-img img {
    filter: brightness(1);
    transform: scale(1.02);
}
.photo-name {
    font-size: 15px;
    font-weight: 800;
    padding: 10px 8px 4px;
    text-align: center;
}
.photo-price {
    font-size: 13px;
    color: #ffcc00;
    font-weight: 800;
    text-align: center;
    padding: 0 8px 10px;
    transition: color 0.4s ease;
}
.photo-card.owned .photo-price {
    color: #34c759;
}
.photo-buy-btn {
    margin: 0 10px 12px;
    padding: 10px;
    font-size: 14px;
    font-weight: 800;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #34c759, #248a3d);
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, background 0.3s;
}
.photo-buy-btn:active { transform: scale(0.95); }
.photo-buy-btn:disabled {
    background: #2a2a30;
    color: #5a5a65;
    cursor: default;
}
.photo-card.owned .photo-buy-btn {
    background: linear-gradient(135deg, #ffd700, #b8860b);
    color: #111;
}
.empty-msg {
    color: #666;
    font-size: 16px;
    text-align: center;
    padding: 40px 20px;
    line-height: 1.5;
}

#adminScreen .admin-block {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #1f1f24, #17171b);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 16px;
    border: 1px solid #2c2c34;
}
#adminScreen label {
    display: block;
    font-size: 15px;
    color: #a0a0aa;
    margin-bottom: 8px;
    font-weight: 700;
}
#adminScreen input[type="text"],
#adminScreen input[type="number"] {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #0d0d0f;
    color: #fff;
    margin-bottom: 14px;
    -webkit-appearance: none;
}
#adminScreen input[type="file"] {
    width: 100%;
    font-size: 14px;
    color: #a0a0aa;
    margin-bottom: 14px;
}
#adminScreen .admin-btn {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 800;
    border-radius: 14px;
    background: linear-gradient(135deg, #34c759, #248a3d);
    color: #fff;
    border: none;
    cursor: pointer;
    letter-spacing: 0.5px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
#adminScreen .admin-btn:active { transform: scale(0.97); }
.admin-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0d0f;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #2c2c34;
}
.admin-list-item img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
}
.admin-list-item .info {
    flex: 1;
    min-width: 0;
}
.admin-list-item .info .name {
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.admin-list-item .info .price {
    font-size: 13px;
    color: #ffcc00;
    font-weight: 700;
}
.admin-list-item .del {
    background: #ff3b30;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

#cheatBtn {
    width: 100%;
    max-width: 400px;
    padding: 16px;
    font-size: 17px;
    font-weight: 800;
    border-radius: 16px;
    background: linear-gradient(135deg, #8e44ad, #5b2c8a);
    color: #fff;
    border: none;
    cursor: pointer;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
#cheatBtn:active { transform: scale(0.97); }

.nav {
    display: flex;
    background: #14141a;
    border-top: 1px solid #2a2a30;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    gap: 6px;
}
.nav button {
    flex: 1;
    background: #23232a;
    color: #8a8a95;
    font-size: 12px;
    font-weight: 800;
    padding: 14px 4px;
    border-radius: 14px;
    transition: box-shadow 0.45s ease, color 0.3s ease;
}
.nav button.active {
    background: linear-gradient(135deg, #ffcc00, #ff9500);
    color: #111;
}
body.crit-mode .nav button.active {
    color: #fff;
    box-shadow: 0 0 25px rgba(255,0,51,0.55);
}

.shake { animation: shakeAnim 1s ease-in-out; }
@keyframes shakeAnim {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-12px, 6px) rotate(-2deg); }
    20% { transform: translate(12px, -6px) rotate(2deg); }
    30% { transform: translate(-10px, -4px) rotate(-1.5deg); }
    40% { transform: translate(10px, 4px) rotate(1.5deg); }
    50% { transform: translate(-7px, 2px); }
    60% { transform: translate(7px, -2px); }
    70% { transform: translate(-5px, 3px); }
    80% { transform: translate(5px, -3px); }
    90% { transform: translate(-2px, 1px); }
}
</style>
</head>
<body>

<div id="demonGlow"></div>

<div id="mainScreen" class="screen active">
    <div class="score-wrap">
        <div id="floatContainer"></div>
        <h1 id="score">$0</h1>
        <div id="critLabel">КРИТИЧЕСКИЙ КЛИК!</div>
    </div>
    <button id="clickBtn" class="demon-btn"><span>💰 ЗАРАБОТАТЬ</span></button>
</div>

<div id="upgradesScreen" class="screen">
    <div class="shop-title">⚡ Улучшения</div>
    <div id="upgradesList" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    <button id="cheatBtn">🧪 [DEBUG] +100 000$</button>
</div>

<div id="purchasesScreen" class="screen">
    <div class="shop-title">🖼️ Покупки</div>
    <div id="purchasesGrid" class="purchases-grid"></div>
    <div id="emptyMsg" class="empty-msg" style="display:none;">
        Пока нет фотографий.<br>Зайди в админку и загрузи первую!
    </div>
</div>

<div id="adminScreen" class="screen">
    <div class="shop-title">⚙️ Админка</div>

    <div class="admin-block">
        <label>1. Выбери фото из галереи</label>
        <input type="file" id="photoInput" accept="image/*">
        <img id="previewImg" style="display:none; width:100%; max-height:200px; object-fit:cover; border-radius:12px; margin-bottom:14px;">

        <label>2. Название</label>
        <input type="text" id="photoName" placeholder="Например: Закат на море">

        <label>3. Цена (в $)</label>
        <input type="number" id="photoPrice" placeholder="500" inputmode="numeric">

        <button class="admin-btn" id="addPhotoBtn">➕ Добавить в магазин</button>
    </div>

    <div class="admin-block">
        <label>Загруженные фото (<span id="photoCount">0</span>)</label>
        <div id="adminList"></div>
    </div>
</div>

<div class="nav">
    <button id="navMain" class="demon-btn active"><span>💰 Клик</span></button>
    <button id="navUpgrades" class="demon-btn"><span>⚡ Апы</span></button>
    <button id="navPurchases" class="demon-btn"><span>🖼️ Фото</span></button>
    <button id="navAdmin" class="demon-btn"><span>⚙️ Админ</span></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDretPeR52fWR1kqkUQ-1MkEz4_QHpZ_HI",
    authDomain: "myicker.firebaseapp.com",
    databaseURL: "https://myicker-default-rtdb.firebaseio.com",
    projectId: "myicker",
    storageBucket: "myicker.firebasestorage.app",
    messagingSenderId: "384406957699",
    appId: "1:384406957699:web:7fca8968570664a67135b6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const photosRef = ref(db, 'photos');

// ==================== ИГРА ====================
let score = 0;
let clickBonus = 0;
let critLevel = 0;
const CRIT_MULTIPLIER = 5;
let isCritMode = false;
let critTimeout = null;

const upgrades = [
    { id: 'click', name: '💪 Сила клика',       baseCost: 10,  costMult: 1.5, level: 0 },
    { id: 'crit',  name: '🎯 Критический клик', baseCost: 100, costMult: 1.3, maxLevel: 50, level: 0 }
];

let photos = []; // теперь с сервера
let localOwned = {}; // что куплено на этом устройстве
let currentImageData = null;

const OWNED_KEY = 'clicker_owned_v1';

function loadOwned() {
    try {
        const raw = localStorage.getItem(OWNED_KEY);
        localOwned = raw ? JSON.parse(raw) : {};
    } catch(e) { localOwned = {}; }
}
function saveOwned() {
    try { localStorage.setItem(OWNED_KEY, JSON.stringify(localOwned)); } catch(e) {}
}

const scoreEl = document.getElementById('score');
const clickBtn = document.getElementById('clickBtn');
const upgradesList = document.getElementById('upgradesList');
const purchasesGrid = document.getElementById('purchasesGrid');
const emptyMsg = document.getElementById('emptyMsg');
const mainScreen = document.getElementById('mainScreen');
const upgradesScreen = document.getElementById('upgradesScreen');
const purchasesScreen = document.getElementById('purchasesScreen');
const adminScreen = document.getElementById('adminScreen');
const navMain = document.getElementById('navMain');
const navUpgrades = document.getElementById('navUpgrades');
const navPurchases = document.getElementById('navPurchases');
const navAdmin = document.getElementById('navAdmin');
const floatContainer = document.getElementById('floatContainer');
const critLabel = document.getElementById('critLabel');
const cheatBtn = document.getElementById('cheatBtn');

const photoInput = document.getElementById('photoInput');
const previewImg = document.getElementById('previewImg');
const photoName = document.getElementById('photoName');
const photoPrice = document.getElementById('photoPrice');
const addPhotoBtn = document.getElementById('addPhotoBtn');
const adminList = document.getElementById('adminList');
const photoCount = document.getElementById('photoCount');

const colors = ['#ffcc00', '#ff3b30', '#34c759', '#af52de', '#00c7be', '#ff9500', '#007aff', '#ff2d55'];
let colorIdx = 0;

function getClickValue() { return 1 + clickBonus; }

function fmt(n) {
    if (isNaN(n) || n === null) return '0';
    if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(2) + 'K';
    return Math.floor(n).toString();
}

function fmtPrice(n) {
    return '$' + Number(n).toLocaleString('ru-RU');
}

function computeScoreFontSize(len) {
    if (len <= 4) return 88;
    if (len === 5) return 80;
    if (len === 6) return 70;
    if (len === 7) return 62;
    if (len === 8) return 54;
    if (len === 9) return 46;
    if (len === 10) return 40;
    if (len === 11) return 34;
    if (len === 12) return 30;
    return 26;
}

function fitScore() {
    const text = scoreEl.innerText;
    scoreEl.style.fontSize = computeScoreFontSize(text.length) + 'px';
}

function updateUI() {
    scoreEl.innerText = '$' + fmt(score);
    fitScore();
    updateShop();
    updatePurchases();
}

// ===== УЛУЧШЕНИЯ =====
function getCost(upg) {
    if (upg.maxLevel && upg.level >= upg.maxLevel) return null;
    return Math.floor(upg.baseCost * Math.pow(upg.costMult, upg.level));
}

function renderShop() {
    upgradesList.innerHTML = '';
    upgrades.forEach((upg, i) => {
        const item = document.createElement('div');
        item.className = 'upgrade-item';

        const header = document.createElement('div');
        header.className = 'upgrade-header';
        const name = document.createElement('div');
        name.className = 'upgrade-name';
        name.innerText = upg.name;
        const lvl = document.createElement('div');
        lvl.className = 'upgrade-level';
        header.appendChild(name);
        header.appendChild(lvl);

        const desc = document.createElement('div');
        desc.className = 'upgrade-desc';

        const cost = document.createElement('div');
        cost.className = 'upgrade-cost';

        const btn = document.createElement('button');
        btn.className = 'upgrade-btn demon-btn';
        const btnSpan = document.createElement('span');
        btnSpan.innerText = 'Купить';
        btn.appendChild(btnSpan);
        btn.addEventListener('click', () => buyUpgrade(i));

        item.appendChild(header);
        item.appendChild(desc);
        item.appendChild(cost);
        item.appendChild(btn);
        upgradesList.appendChild(item);

        upg._lvlEl = lvl;
        upg._descEl = desc;
        upg._costEl = cost;
        upg._btnEl = btn;
        upg._btnSpanEl = btnSpan;
    });
    updateShop();
}

function updateShop() {
    upgrades.forEach(upg => {
        const cost = getCost(upg);
        const maxed = cost === null;
        const canBuy = !maxed && score >= cost;

        let levelText = '';
        let descText = '';

        if (upg.id === 'click') {
            levelText = 'Уровень ' + upg.level + ' · +' + clickBonus;
            descText = 'Следующий уровень даст +' + (upg.level + 1) + ' к силе клика';
        } else if (upg.id === 'crit') {
            levelText = critLevel + '% / 50%';
            descText = 'Крит = x5 от клика. Следующий уровень: ' + (critLevel + 1) + '% шанс';
        }

        upg._lvlEl.innerText = levelText;
        upg._descEl.innerText = descText;
        upg._costEl.innerText = maxed ? '✅ МАКСИМУМ' : '💰 Цена: $' + fmt(cost);
        upg._btnEl.disabled = maxed || !canBuy;
        upg._btnSpanEl.innerText = maxed ? 'Куплено' : (canBuy ? 'Купить' : 'Не хватает');
    });
}

function buyUpgrade(i) {
    const upg = upgrades[i];
    const cost = getCost(upg);
    if (cost === null || score < cost) return;

    score -= cost;
    upg.level++;

    if (upg.id === 'click') {
        clickBonus += upg.level;
    } else if (upg.id === 'crit') {
        critLevel++;
    }

    updateUI();
}

// ===== ФОТО ИЗ FIREBASE =====
function loadPhotosFromCloud() {
    onValue(photosRef, (snapshot) => {
        photos = [];
        snapshot.forEach((child) => {
            const p = child.val();
            p.id = child.key;
            photos.push(p);
        });
        // Сортируем по дате добавления (по ID)
        photos.sort((a, b) => (a.id > b.id ? 1 : -1));
        renderPurchases();
        renderAdminList();
    }, (error) => {
        console.error('Firebase error:', error);
        emptyMsg.style.display = 'block';
        emptyMsg.innerText = 'Ошибка загрузки фото: ' + error.message;
    });
}

function renderPurchases() {
    purchasesGrid.innerHTML = '';

    if (photos.length === 0) {
        emptyMsg.style.display = 'block';
        emptyMsg.innerHTML = 'Пока нет фотографий.<br>Зайди в админку и загрузи первую!';
        return;
    }
    emptyMsg.style.display = 'none';

    photos.forEach((photo, i) => {
        const isOwned = !!localOwned[photo.id];
        const card = document.createElement('div');
        card.className = 'photo-card' + (isOwned ? ' owned' : ' locked');

        const imgWrap = document.createElement('div');
        imgWrap.className = 'photo-img';
        const img = document.createElement('img');
        img.src = photo.img;
        img.alt = photo.name;
        imgWrap.appendChild(img);

        const name = document.createElement('div');
        name.className = 'photo-name';
        name.innerText = photo.name;

        const price = document.createElement('div');
        price.className = 'photo-price';

        const btn = document.createElement('button');
        btn.className = 'photo-buy-btn';
        btn.addEventListener('click', () => buyPhoto(i));

        card.appendChild(imgWrap);
        card.appendChild(name);
        card.appendChild(price);
        card.appendChild(btn);
        purchasesGrid.appendChild(card);

        photo._cardEl = card;
        photo._priceEl = price;
        photo._btnEl = btn;
    });
    updatePurchases();
}

function updatePurchases() {
    photos.forEach(photo => {
        if (!photo._cardEl) return;
        const isOwned = !!localOwned[photo.id];
        if (isOwned) {
            photo._cardEl.classList.remove('locked');
            photo._cardEl.classList.add('owned');
            photo._priceEl.innerText = '✅ Куплено';
            photo._btnEl.disabled = true;
            photo._btnEl.innerText = 'В коллекции';
        } else {
            photo._cardEl.classList.add('locked');
            photo._cardEl.classList.remove('owned');
            photo._priceEl.innerText = '💰 ' + fmtPrice(photo.price);
            const canBuy = score >= photo.price;
            photo._btnEl.disabled = !canBuy;
            photo._btnEl.innerText = canBuy ? 'Купить' : 'Не хватает';
        }
    });
}

function buyPhoto(i) {
    const photo = photos[i];
    if (localOwned[photo.id]) return;
    if (score < photo.price) return;

    score -= photo.price;
    localOwned[photo.id] = true;
    saveOwned();
    updateUI();
}

// ===== АДМИНКА =====
photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
        const rawData = ev.target.result;
        const img = new Image();
        img.onload = () => {
            const maxSide = 600;
            let w = img.width, h = img.height;
            if (w > h && w > maxSide) { h = h * (maxSide / w); w = maxSide; }
            else if (h > w && h > maxSide) { w = w * (maxSide / h); h = maxSide; }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            currentImageData = canvas.toDataURL('image/jpeg', 0.7);
            previewImg.src = currentImageData;
            previewImg.style.display = 'block';
        };
        img.src = rawData;
    };
    reader.readAsDataURL(file);
});

addPhotoBtn.addEventListener('click', () => {
    if (!currentImageData) { alert('Сначала выбери фото'); return; }
    const name = photoName.value.trim();
    if (!name) { alert('Введи название'); return; }
    const price = parseInt(photoPrice.value);
    if (!price || price <= 0) { alert('Введи цену больше 0'); return; }

    addPhotoBtn.disabled = true;
    addPhotoBtn.innerText = 'Загрузка...';

    const newRef = push(photosRef);
    set(newRef, {
        name: name,
        price: price,
        img: currentImageData
    }).then(() => {
        // Сброс формы
        currentImageData = null;
        previewImg.style.display = 'none';
        previewImg.src = '';
        photoInput.value = '';
        photoName.value = '';
        photoPrice.value = '';
        addPhotoBtn.disabled = false;
        addPhotoBtn.innerText = '➕ Добавить в магазин';
    }).catch((error) => {
        alert('Ошибка: ' + error.message);
        addPhotoBtn.disabled = false;
        addPhotoBtn.innerText = '➕ Добавить в магазин';
    });
});

function renderAdminList() {
    adminList.innerHTML = '';
    photoCount.innerText = photos.length;

    if (photos.length === 0) {
        adminList.innerHTML = '<div style="color:#666; text-align:center; padding:10px;">Пока пусто</div>';
        return;
    }

    photos.forEach((photo, i) => {
        const item = document.createElement('div');
        item.className = 'admin-list-item';

        const img = document.createElement('img');
        img.src = photo.img;

        const info = document.createElement('div');
        info.className = 'info';
        const nm = document.createElement('div');
        nm.className = 'name';
        nm.innerText = photo.name;
        const pr = document.createElement('div');
        pr.className = 'price';
        pr.innerText = fmtPrice(photo.price);
        info.appendChild(nm);
        info.appendChild(pr);

        const del = document.createElement('button');
        del.className = 'del';
        del.innerText = 'Удалить';
        del.addEventListener('click', () => {
            if (!confirm('Удалить «' + photo.name + '»?')) return;
            remove(ref(db, 'photos/' + photo.id));
        });

        item.appendChild(img);
        item.appendChild(info);
        item.appendChild(del);
        adminList.appendChild(item);
    });
}

// ===== ЦВЕТА / КРИТ =====
function setNormalColor() {
    const color = colors[colorIdx];
    scoreEl.style.color = color;
    scoreEl.style.textShadow = '0 0 35px ' + color;
}

function cycleColor() {
    colorIdx = (colorIdx + 1) % colors.length;
    setNormalColor();
}

function spawnFloat(value, type) {
    const el = document.createElement('div');
    el.className = 'float-num' + (type === 'crit' ? ' crit' : '');
    el.innerText = '+' + fmt(value) + '$';

    el.style.visibility = 'hidden';
    el.style.left = '0px';
    el.style.top = '0px';
    floatContainer.appendChild(el);

    const containerW = floatContainer.clientWidth;
    const containerH = floatContainer.clientHeight;
    const elW = el.offsetWidth;
    const elH = el.offsetHeight;

    const maxX = Math.max(0, containerW - elW);
    const randomX = Math.random() * maxX;

    const minY = 130;
    const maxY = Math.max(minY, containerH - elH - 25);
    const randomY = minY + Math.random() * Math.max(0, maxY - minY);

    el.style.left = randomX + 'px';
    el.style.top = randomY + 'px';
    el.style.visibility = 'visible';

    setTimeout(() => el.remove(), 1300);
}

function enterCritMode() {
    isCritMode = true;
    document.body.classList.add('crit-mode');
    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');

    scoreEl.style.color = '';
    scoreEl.style.textShadow = '';

    critLabel.classList.remove('show');
    void critLabel.offsetWidth;
    critLabel.classList.add('show');

    if (critTimeout) clearTimeout(critTimeout);
    critTimeout = setTimeout(() => {
        isCritMode = false;
        document.body.classList.remove('crit-mode');
        document.body.classList.remove('shake');
        critLabel.classList.remove('show');
        setNormalColor();
    }, 1200);
}

function addScore(e) {
    if (e) e.preventDefault();

    const base = getClickValue();
    let value = base;
    let isCrit = false;

    if (critLevel > 0 && Math.random() * 100 < critLevel) {
        value = base * CRIT_MULTIPLIER;
        isCrit = true;
    }

    score += value;

    if (isCrit) {
        enterCritMode();
    } else if (!isCritMode) {
        cycleColor();
    }

    spawnFloat(value, isCrit ? 'crit' : 'normal');

    scoreEl.style.transform = 'scale(1.1)';
    setTimeout(() => scoreEl.style.transform = 'scale(1)', 90);

    updateUI();
}

cheatBtn.addEventListener('click', () => {
    score += 100000;
    updateUI();
});

// ===== ВКЛАДКИ =====
function activateTab(tab) {
    mainScreen.classList.toggle('active', tab === 'main');
    upgradesScreen.classList.toggle('active', tab === 'upgrades');
    purchasesScreen.classList.toggle('active', tab === 'purchases');
    adminScreen.classList.toggle('active', tab === 'admin');

    navMain.classList.toggle('active', tab === 'main');
    navUpgrades.classList.toggle('active', tab === 'upgrades');
    navPurchases.classList.toggle('active', tab === 'purchases');
    navAdmin.classList.toggle('active', tab === 'admin');

    if (tab === 'upgrades') updateShop();
    if (tab === 'purchases') updatePurchases();
    if (tab === 'admin') renderAdminList();
}

navMain.addEventListener('click', () => activateTab('main'));
navUpgrades.addEventListener('click', () => activateTab('upgrades'));
navPurchases.addEventListener('click', () => activateTab('purchases'));
navAdmin.addEventListener('click', () => activateTab('admin'));

clickBtn.addEventListener('touchstart', addScore, { passive: false });
clickBtn.addEventListener('mousedown', addScore);

// ===== СТАРТ =====
loadOwned();
renderShop();
updateUI();
setNormalColor();
loadPhotosFromCloud();
</script>
